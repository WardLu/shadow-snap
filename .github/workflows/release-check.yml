name: Release metadata check

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop unconfigured release
        run: |
          echo "::error::shadow-snap 尚未定义版本源、CHANGELOG.md 和正式 Release 流程；请先补齐发布元数据，再创建 v* Tag。"
          exit 1
